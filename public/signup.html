<!DOCTYPE html>
<html>
<head>
  <title>SRIOT Signup</title>

  <style>
    body {
      font-family: Arial;
      background: #0b1220;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #111827;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 260px;
    }

    input {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px;
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #1d4ed8;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
      display: block;
      margin-top: 12px;
    }

    /* 🔥 ERROR TEXT */
    .error {
      color: #ef4444;
      font-size: 12px;
      margin-top: -5px;
      text-align: left;
    }

    .note {
      color: #9ca3af;
      font-size: 12px;
      text-align: left;
      margin-top: -5px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>SRIOT Signup</h2>

  <!-- USERNAME -->
  <input id="username" placeholder="Username"
         oninput="handleUsernameInput()">

  <!-- 🔥 NOTE -->
  <div class="note">Minimum 8 lowercase characters</div>

  <!-- ERROR -->
  <div id="userError" class="error"></div>

  <!-- PASSWORD -->
  <input id="password" type="password" placeholder="Password">

  <div id="passError" class="error"></div>

  <button onclick="signup()">Signup</button>

  <a href="index.html">Already have account? Login</a>
</div>

<script>

const BASE_URL = "https://iot-backend-atfp.onrender.com";

// 🔥 FORCE LOWERCASE INPUT
function handleUsernameInput() {
  let input = document.getElementById("username");
  input.value = input.value.toLowerCase();
}

// 🔥 SIGNUP FUNCTION
async function signup() {

  let username = document.getElementById("username").value.trim();
  let password = document.getElementById("password").value.trim();

  const userError = document.getElementById("userError");
  const passError = document.getElementById("passError");

  // RESET ERRORS
  userError.innerText = "";
  passError.innerText = "";

  // 🔥 VALIDATION
  if (username.length < 8) {
    userError.innerText = "Username must be at least 8 characters";
    return;
  }

  if (!password) {
    passError.innerText = "Password required";
    return;
  }

  try {

    const res = await fetch(BASE_URL + "/signup", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    // 🔥 ERROR HANDLING
    if (!res.ok) {
      userError.innerText = data.message || data;
      return;
    }

    // ✅ SUCCESS
    alert("Signup successful!\nYour Device ID: " + data.deviceId);

    window.location.href = "index.html";

  } catch (err) {
    alert("Server error");
  }
}

</script>

</body>
</html>
