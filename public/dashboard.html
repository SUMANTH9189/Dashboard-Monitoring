<!DOCTYPE html>
<html>
<head>
  <title>ESP32 IoT Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0b1220;
      color: #e5e7eb;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select, button {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: #1f2937;
      color: white;
      cursor: pointer;
    }

    .status {
      font-size: 12px;
      color: #9ca3af;
    }

    .container {
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }

    .card-title {
      font-size: 14px;
      color: #9ca3af;
    }

    .card-value {
      font-size: 22px;
      margin-top: 8px;
      font-weight: bold;
    }

    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    canvas {
      background: #111827;
      border-radius: 10px;
      padding: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>📡 ESP32 IoT Dashboard</h1>

  <div class="controls">
    <select>
      <option>Last 1 Hour</option>
      <option>Last 24 Hours</option>
    </select>

    <button onclick="loadData()">🔄 Refresh</button>
    <span class="status" id="status">Loading...</span>
  </div>
</header>

<div class="container">

  <!-- 🔥 CARDS -->
  <div class="cards">
    <div class="card">
      <div class="card-title">🌡 Current Temp</div>
      <div id="tempNow" class="card-value">--</div>
    </div>

    <div class="card">
      <div class="card-title">💧 Humidity</div>
      <div id="humNow" class="card-value">--</div>
    </div>

    <div class="card">
      <div class="card-title">🔺 Max Temp</div>
      <div id="tempMax" class="card-value">--</div>
    </div>

    <div class="card">
      <div class="card-title">🔻 Min Temp</div>
      <div id="tempMin" class="card-value">--</div>
    </div>

    <div class="card">
      <div class="card-title">📊 Data Points</div>
      <div id="count" class="card-value">--</div>
    </div>
  </div>

  <!-- 📊 CHARTS -->
  <div class="charts">
    <canvas id="tempChart"></canvas>
    <canvas id="humChart"></canvas>
  </div>

</div>

<script>

const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "index.html";
}

let tempChart, humChart;

async function loadData() {

  document.getElementById("status").innerText = "Loading...";

  try {
    const res = await fetch("/data", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    if (res.status !== 200) {
      document.getElementById("status").innerText = "Auth Error";
      return;
    }

    const data = await res.json();

    const temp = data.temperature;
    const hum = data.humidity;

    if (!temp || temp.length === 0) {
      document.getElementById("status").innerText = "No Data";
      return;
    }

    // 🔥 UPDATE CARDS
    document.getElementById("tempNow").innerText = temp.at(-1) + " °C";
    document.getElementById("humNow").innerText = hum.at(-1) + " %";
    document.getElementById("tempMax").innerText = Math.max(...temp);
    document.getElementById("tempMin").innerText = Math.min(...temp);
    document.getElementById("count").innerText = temp.length;

    const labels = temp.map((_, i) => i+1);

    // 🌡 TEMP CHART
    if (!tempChart) {
      tempChart = new Chart(document.getElementById("tempChart"), {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "Temperature (°C)",
            data: temp,
            borderColor: "#3b82f6",
            tension: 0.3
          }]
        }
      });
    } else {
      tempChart.data.labels = labels;
      tempChart.data.datasets[0].data = temp;
      tempChart.update();
    }

    // 💧 HUM CHART
    if (!humChart) {
      humChart = new Chart(document.getElementById("humChart"), {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "Humidity (%)",
            data: hum,
            borderColor: "#ef4444",
            tension: 0.3
          }]
        }
      });
    } else {
      humChart.data.labels = labels;
      humChart.data.datasets[0].data = hum;
      humChart.update();
    }

    document.getElementById("status").innerText = "Live ✅";

  } catch (err) {
    document.getElementById("status").innerText = "Error ❌";
    console.error(err);
  }
}

// 🚀 AUTO REFRESH
loadData();
setInterval(loadData, 5000);

</script>

</body>
</html>
