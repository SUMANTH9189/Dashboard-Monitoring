<!DOCTYPE html>
<html>
<head>
  <title>SRIOT Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0b1220;
      color: #e5e7eb;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
    }

    h1 {
      font-size: 20px;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select, button, input {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: #1f2937;
      color: white;
    }

    .container {
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 15px;
    }

    .card {
      background: #111827;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .card-title {
      color: #9ca3af;
    }

    .card-value {
      font-size: 22px;
      font-weight: bold;
    }

    .charts {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>📡 SRIOT Dashboard</h1>

  <div class="controls">
    <select id="rangeSelect" onchange="loadData()">
      <option value="5m">5 min</option>
      <option value="30m">30 min</option>
      <option value="1h" selected>1 hour</option>
      <option value="24h">24 hours</option>
      <option value="48h">48 hours</option>
    </select>

    <!-- 🔥 DATE PICKER -->
    <input type="date" id="startDate">
    <input type="date" id="endDate">

    <button onclick="loadData()">Refresh</button>
    <button onclick="downloadCSV()">⬇ CSV</button>

    <span id="status">Loading...</span>
  </div>
</header>

<div class="container">

<div class="cards">
  <div class="card"><div class="card-title">Temp</div><div id="tempNow" class="card-value">--</div></div>
  <div class="card"><div class="card-title">Humidity</div><div id="humNow" class="card-value">--</div></div>
  <div class="card"><div class="card-title">Max</div><div id="tempMax" class="card-value">--</div></div>
  <div class="card"><div class="card-title">Min</div><div id="tempMin" class="card-value">--</div></div>
  <div class="card"><div class="card-title">Points</div><div id="count" class="card-value">--</div></div>
  <div class="card"><div class="card-title">Avg Temp</div><div id="avgTemp" class="card-value">--</div></div>
  <div class="card"><div class="card-title">Avg Hum</div><div id="avgHum" class="card-value">--</div></div>
</div>

<div class="charts">
  <canvas id="tempChart"></canvas>
  <canvas id="humChart"></canvas>
</div>

</div>

<script>

const token = localStorage.getItem("token");
if (!token) window.location.href = "index.html";

let tempChart, humChart;
let currentData = [];

function smooth(data) {
  // 🔥 Moving average smoothing (fix spikes)
  return data.map((v, i, arr) => {
    const prev = arr[i-1] || v;
    const next = arr[i+1] || v;
    return ((prev + v + next)/3).toFixed(2);
  });
}

async function loadData() {

  document.getElementById("status").innerText = "Loading...";

  const range = document.getElementById("rangeSelect").value;
  const start = document.getElementById("startDate").value;
  const end = document.getElementById("endDate").value;

  let url = `/data?range=${range}`;

  if (start && end) {
    url = `/data?start=${start}&end=${end}`; // backend optional
  }

  try {
    const res = await fetch(url, {
      headers: { "Authorization": "Bearer " + token }
    });

    const data = await res.json();
    currentData = data;

    let temp = smooth(data.temperature);
    let hum = smooth(data.humidity);

    if (temp.length === 0) {
      document.getElementById("status").innerText = "No Data";
      return;
    }

    // CARDS
    document.getElementById("tempNow").innerText = temp.at(-1) + " °C";
    document.getElementById("humNow").innerText = hum.at(-1) + " %";
    document.getElementById("tempMax").innerText = Math.max(...temp);
    document.getElementById("tempMin").innerText = Math.min(...temp);
    document.getElementById("count").innerText = temp.length;

    const avgTemp = temp.reduce((a,b)=>a+b,0)/temp.length;
    const avgHum = hum.reduce((a,b)=>a+b,0)/hum.length;

    document.getElementById("avgTemp").innerText = avgTemp.toFixed(1);
    document.getElementById("avgHum").innerText = avgHum.toFixed(1);

    const labels = data.time;

    // TEMP CHART
    if (!tempChart) {
      tempChart = new Chart(tempChartCanvas, {
        type: "line",
        data: { labels, datasets:[{data: temp, borderColor:"#3b82f6"}] }
      });
    } else {
      tempChart.data.labels = labels;
      tempChart.data.datasets[0].data = temp;
      tempChart.update();
    }

    // HUM CHART
    if (!humChart) {
      humChart = new Chart(humChartCanvas, {
        type: "line",
        data: { labels, datasets:[{data: hum, borderColor:"#ef4444"}] }
      });
    } else {
      humChart.data.labels = labels;
      humChart.data.datasets[0].data = hum;
      humChart.update();
    }

    document.getElementById("status").innerText = "Live ✅";

  } catch (err) {
    document.getElementById("status").innerText = "Error";
  }
}

// 🔥 CSV DOWNLOAD
function downloadCSV() {
  let csv = "Time,Temperature,Humidity\n";

  currentData.time.forEach((t,i)=>{
    csv += `${t},${currentData.temperature[i]},${currentData.humidity[i]}\n`;
  });

  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "iot_data.csv";
  a.click();
}

loadData();
setInterval(loadData, 5000);

</script>

</body>
</html>
