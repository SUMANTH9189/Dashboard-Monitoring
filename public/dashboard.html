<!DOCTYPE html>
<html>
<head>
  <title>SRIOT Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0b1220;
      color: #e5e7eb;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 15px 25px;
      background: #111827;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select, button, input {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: #1f2937;
      color: white;
    }

    .container {
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 15px;
    }

    .card {
      background: #111827;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .charts {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    canvas {
      width: 100% !important;
      height: 300px !important;
      background: #111827;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<header>
  <h2>📡 SRIOT Dashboard</h2>

  <div class="controls">
    <select id="rangeSelect" onchange="loadData()">
      <option value="5m">5 min</option>
      <option value="30m">30 min</option>
      <option value="1h" selected>1 hour</option>
      <option value="24h">24 hours</option>
    </select>

    <input type="date" id="startDate">

    <button onclick="loadData()">Refresh</button>
    <span id="status">Loading...</span>
  </div>
</header>

<div class="container">

<div class="cards">
  <div class="card"><div>Temp</div><div id="tempNow">--</div></div>
  <div class="card"><div>Humidity</div><div id="humNow">--</div></div>
  <div class="card"><div>Max</div><div id="tempMax">--</div></div>
  <div class="card"><div>Min</div><div id="tempMin">--</div></div>
  <div class="card"><div>Points</div><div id="count">--</div></div>
  <div class="card"><div>Avg Temp</div><div id="avgTemp">--</div></div>
  <div class="card"><div>Avg Hum</div><div id="avgHum">--</div></div>
</div>

<div class="charts">
  <canvas id="tempChart"></canvas>
  <canvas id="humChart"></canvas>
</div>

</div>

<script>

const token = localStorage.getItem("token");
if (!token) window.location.href = "index.html";

let tempChart, humChart;

async function loadData() {

  document.getElementById("status").innerText = "Loading...";

  const range = document.getElementById("rangeSelect").value;
  const date = document.getElementById("startDate").value;

  let url = `/data?range=${range}`;
  if (date) url = `/data?date=${date}`;

  const res = await fetch(url, {
    headers: { "Authorization": "Bearer " + token }
  });

  const data = await res.json();

  let temp = data.temperature || [];
  let hum = data.humidity || [];
  let labels = data.time || [];

  // 🔥 LIMIT DATA
  const MAX = 50;
  temp = temp.slice(-MAX);
  hum = hum.slice(-MAX);
  labels = labels.slice(-MAX);

  if (temp.length === 0) {
    document.getElementById("status").innerText = "No Data";
    return;
  }

  document.getElementById("tempNow").innerText = temp.at(-1).toFixed(2);
  document.getElementById("humNow").innerText = hum.at(-1).toFixed(2);
  document.getElementById("tempMax").innerText = Math.max(...temp).toFixed(2);
  document.getElementById("tempMin").innerText = Math.min(...temp).toFixed(2);
  document.getElementById("count").innerText = temp.length;

  const avgTemp = temp.reduce((a,b)=>a+b,0)/temp.length;
  const avgHum = hum.reduce((a,b)=>a+b,0)/hum.length;

  document.getElementById("avgTemp").innerText = avgTemp.toFixed(2);
  document.getElementById("avgHum").innerText = avgHum.toFixed(2);

  if (!tempChart) {
    tempChart = new Chart(document.getElementById("tempChart"), {
      type: "line",
      data: {
        labels: labels,
        datasets: [{ data: temp, borderColor: "#3b82f6" }]
      },
      options: chartOptions()
    });
  } else {
    tempChart.data.labels = labels;
    tempChart.data.datasets[0].data = temp;
    tempChart.update();
  }

  if (!humChart) {
    humChart = new Chart(document.getElementById("humChart"), {
      type: "line",
      data: {
        labels: labels,
        datasets: [{ data: hum, borderColor: "#ef4444" }]
      },
      options: chartOptions()
    });
  } else {
    humChart.data.labels = labels;
    humChart.data.datasets[0].data = hum;
    humChart.update();
  }

  document.getElementById("status").innerText = "Live ✅";
}

function chartOptions() {
  return {
    responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { maxTicksLimit: 6, color: "white" } },
      y: { ticks: { color: "white" } }
    }
  };
}

loadData();
setInterval(loadData, 10000);

</script>

</body>
</html>
