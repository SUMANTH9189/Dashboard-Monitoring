<!DOCTYPE html>
<html>
<head>
  <title>SRIOT Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0b1220;
      color: #e5e7eb;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
    }

    h1 { font-size: 20px; }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select, button, input {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: #1f2937;
      color: white;
    }

    .container { padding: 20px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 15px;
    }

    .card {
      background: #111827;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .card-title { color: #9ca3af; }

    .card-value {
      font-size: 22px;
      font-weight: bold;
    }

    .charts {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>📡 SRIOT Dashboard</h1>

  <div class="controls">
    <select id="rangeSelect" onchange="loadData()">
      <option value="5m">5 min</option>
      <option value="30m">30 min</option>
      <option value="1h" selected>1 hour</option>
      <option value="24h">24 hours</option>
      <option value="48h">48 hours</option>
    </select>

    <input type="date" id="startDate">

    <button onclick="loadData()">Refresh</button>
    <button onclick="downloadCSV()">⬇ CSV</button>

    <span id="status">Loading...</span>
  </div>
</header>

<div class="container">

<div class="cards">
  <div class="card"><div class="card-title">Temp</div><div id="tempNow" class="card-value">--</div></div>
  <div class="card"><div class="card-title">Humidity</div><div id="humNow" class="card-value">--</div></div>
  <div class="card"><div class="card-title">Max</div><div id="tempMax" class="card-value">--</div></div>
  <div class="card"><div class="card-title">Min</div><div id="tempMin" class="card-value">--</div></div>
  <div class="card"><div class="card-title">Points</div><div id="count" class="card-value">--</div></div>
  <div class="card"><div class="card-title">Avg Temp</div><div id="avgTemp" class="card-value">--</div></div>
  <div class="card"><div class="card-title">Avg Hum</div><div id="avgHum" class="card-value">--</div></div>
</div>

<div class="charts">
  <canvas id="tempChart"></canvas>
  <canvas id="humChart"></canvas>
</div>

</div>

<script>

const token = localStorage.getItem("token");
if (!token) window.location.href = "index.html";

let tempChart, humChart;

async function loadData() {

  document.getElementById("status").innerText = "Loading...";

  try {

    const range = document.getElementById("rangeSelect").value;
    const date = document.getElementById("startDate").value;

    let url = `/data?range=${range}`;
    if (date) url = `/data?date=${date}`;

    console.log("Fetching:", url);

    const res = await fetch(url, {
      headers: { "Authorization": "Bearer " + token }
    });

    // 🔥 HANDLE TOKEN ERROR
    if (res.status === 403 || res.status === 401) {
      localStorage.clear();
      alert("Session expired. Please login again.");
      window.location.href = "index.html";
      return;
    }

    const data = await res.json();

    const temp = (data.temperature || []).filter(v => !isNaN(v));
    const hum = (data.humidity || []).filter(v => !isNaN(v));
    const labels = data.time || [];

    if (temp.length === 0) {
      document.getElementById("status").innerText = "No Data ❌";
      return;
    }

    // CARDS
    document.getElementById("tempNow").innerText = temp.at(-1).toFixed(2) + " °C";
    document.getElementById("humNow").innerText = hum.at(-1).toFixed(2) + " %";
    document.getElementById("tempMax").innerText = Math.max(...temp).toFixed(2);
    document.getElementById("tempMin").innerText = Math.min(...temp).toFixed(2);
    document.getElementById("count").innerText = temp.length;

    const avgTemp = temp.reduce((a,b)=>a+b,0)/temp.length;
    const avgHum = hum.reduce((a,b)=>a+b,0)/hum.length;

    document.getElementById("avgTemp").innerText = avgTemp.toFixed(2);
    document.getElementById("avgHum").innerText = avgHum.toFixed(2);

    // TEMP CHART
    if (!tempChart) {
      tempChart = new Chart(document.getElementById("tempChart"), {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "Temperature (°C)",
            data: temp,
            borderColor: "#3b82f6",
            borderWidth: 2,
            pointRadius: 2,
            tension: 0.2
          }]
        },
        options: chartOptions()
      });
    } else {
      tempChart.data.labels = labels;
      tempChart.data.datasets[0].data = temp;
      tempChart.update();
    }

    // HUM CHART
    if (!humChart) {
      humChart = new Chart(document.getElementById("humChart"), {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "Humidity (%)",
            data: hum,
            borderColor: "#ef4444",
            borderWidth: 2,
            pointRadius: 2,
            tension: 0.2
          }]
        },
        options: chartOptions()
      });
    } else {
      humChart.data.labels = labels;
      humChart.data.datasets[0].data = hum;
      humChart.update();
    }

    document.getElementById("status").innerText = "Live ✅";

  } catch (err) {
    console.error(err);
    document.getElementById("status").innerText = "Error ❌";
  }
}

function chartOptions() {
  return {
    responsive: true,
    plugins: {
      legend: { labels: { color: "white" } }
    },
    scales: {
      x: { ticks: { color: "white" } },
      y: { ticks: { color: "white" } }
    }
  };
}

loadData();
setInterval(loadData, 10000);

</script>

</body>
</html>
