<!DOCTYPE html>
<html>
<head>
  <title>IoT Dashboard</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
    }
    canvas {
      max-width: 900px;
      margin-top: 20px;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>IoT Dashboard (Live)</h2>

<button onclick="logout()">Logout</button>

<!-- 🔥 LIVE VALUES -->
<h3>🌡 Temperature: <span id="temp">--</span> °C</h3>
<h3>💧 Humidity: <span id="hum">--</span> %</h3>

<canvas id="chart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const BASE_URL = "";

let chart;

// 🔐 Check login
const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "index.html";
}

// 🔓 Logout
function logout() {
  localStorage.removeItem("token");
  window.location.href = "index.html";
}

// 📊 Load data
async function loadData() {
  try {
    const res = await fetch(BASE_URL + "/data", {
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    if (res.status === 401 || res.status === 403) {
      alert("Session expired. Please login again.");
      logout();
      return;
    }

    const data = await res.json();

    // ✅ Check new format
    if (!data.temperature || data.temperature.length === 0) {
      console.log("No data available");
      return;
    }

    const labels = data.temperature.map((_, i) => i + 1);

    // 🔥 Update live values
    document.getElementById("temp").innerText =
      data.temperature[data.temperature.length - 1];

    document.getElementById("hum").innerText =
      data.humidity[data.humidity.length - 1];

    // 📈 Create chart
    if (!chart) {
      chart = new Chart(document.getElementById("chart"), {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: "Temperature (°C)",
              data: data.temperature,
              borderWidth: 2,
              tension: 0.3
            },
            {
              label: "Humidity (%)",
              data: data.humidity,
              borderWidth: 2,
              tension: 0.3
            }
          ]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    } 
    // 🔁 Update chart
    else {
      chart.data.labels = labels;
      chart.data.datasets[0].data = data.temperature;
      chart.data.datasets[1].data = data.humidity;
      chart.update();
    }

  } catch (err) {
    console.error("Error loading data:", err);
  }
}

// 🚀 First load
loadData();

// 🔁 Refresh every 5 sec
setInterval(loadData, 5000);

</script>

</body>
</html>
