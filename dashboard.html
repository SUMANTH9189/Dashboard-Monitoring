<!DOCTYPE html>
<html>
<head>
  <title>Dust Dashboard</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
    }
    canvas {
      max-width: 900px;
      margin-top: 20px;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Dust Dashboard (Live)</h2>

<!-- 🔓 Logout button -->
<button onclick="logout()">Logout</button>

<canvas id="chart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let chart;

// 🔐 CHECK LOGIN FIRST
const token = localStorage.getItem("token");

if (!token) {
  window.location.href = "login.html";
}

// 🔓 Logout function
function logout() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}

// 🚀 Load data from backend
async function loadData() {
  try {
    const res = await fetch("https://iot-backend-ym55.onrender.com/data", {
      headers: {
        "Authorization": "Bearer " + token   // 🔥 IMPORTANT FIX
      }
    });

    // ❌ If token invalid → force logout
    if (res.status === 401 || res.status === 403) {
      alert("Session expired. Please login again.");
      logout();
      return;
    }

    const data = await res.json();

    console.log(data);

    const labels = data.values.map((_, i) => i + 1);

    // 🔥 FIRST TIME CREATE CHART
    if (!chart) {
      chart = new Chart(document.getElementById("chart"), {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: "Dust Data",
            data: data.values,
            borderWidth: 2,
            fill: false,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    } 
    // 🔁 UPDATE EXISTING CHART
    else {
      chart.data.labels = labels;
      chart.data.datasets[0].data = data.values;
      chart.update();
    }

  } catch (err) {
    console.error("Error loading data:", err);
  }
}

// 🔥 First load
loadData();

// 🔁 Auto refresh every 5 seconds
setInterval(loadData, 5000);

</script>

</body>
</html>
